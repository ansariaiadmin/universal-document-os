# Universal Document OS — container orchestration (see docs/DEPLOYMENT.md)
# All runtime configuration is environment-driven; copy .env.example to .env first.
services:
  udo:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    env_file:
      - path: .env
        required: false   # falls back to defaults / inline environment below
    environment:
      PORT: 8000
      APP_VERSION: ${APP_VERSION:-3.2.6}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
