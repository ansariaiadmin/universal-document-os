# Universal Document OS — container orchestration
# All runtime configuration is environment-driven; copy .env.example to .env first.
# NOTE: env_file uses the modern optional-file syntax (Compose v2.24+);
# on older Compose versions remove the env_file block entirely.
services:
  udo:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    env_file:
      - path: .env
        required: false   # falls back to defaults / inline environment below
    environment:
      PORT: 8000
      APP_VERSION: ${APP_VERSION:-4.2.0}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      # Opt-in guards (dev defaults: off). Set in .env to enable.
      UDO_API_KEYS: ${UDO_API_KEYS:-}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
